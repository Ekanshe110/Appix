name: Appix APK

# Built once per accepted batch, on purpose: a signed APK per micro-commit
# burns a full Android build without producing a new version. Unit tests and
# the release compile still run on every push; the signed artifact is produced
# here only when it is actually going to be installed.
on:
  workflow_dispatch:
    inputs:
      fast:
        description: "Skip R8 for a faster test build"
        type: boolean
        default: true
      arm64_only:
        description: "Build only the arm64-v8a split"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: appix-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed Appix APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          {
            echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
            echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}"
            echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}"
          } > local.properties

      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_B64"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > bitchord-appix.jks
          {
            echo "storeFile=bitchord-appix.jks"
            echo "storePassword=android"
            echo "keyAlias=forkdebug"
            echo "keyPassword=android"
          } > keystore.properties
          chmod 600 bitchord-appix.jks keystore.properties

      - run: chmod +x gradlew

      - name: Build
        # Lint-vital is the slowest thing in this job (minutes on a release
        # variant) and it runs after the code compiled. The signed APK does
        # not need it; the separate test workflow is the gate for that.
        run: |
          extra_args=()
          if [ "${{ inputs.fast }}" = "true" ]; then
            extra_args+=("-Pappix.fastApk=true")
          fi
          if [ "${{ inputs.arm64_only }}" = "true" ]; then
            extra_args+=("-Pappix.arm64Only=true")
          fi
          ./gradlew :app:assembleDevRelease \
            --build-cache --parallel --stacktrace --console=plain \
            -x :app:lintVitalDevRelease \
            -x :app:lintVitalAnalyzeDevRelease \
            -x :app:lintVitalReportDevRelease \
            "${extra_args[@]}"

      - name: Verify package, label and version
        env:
          EXPECTED_PACKAGE: com.dev.bitchord
          EXPECTED_LABEL: Appix
        run: |
          set -euo pipefail
          bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          apks=(app/build/outputs/apk/dev/release/*.apk)
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            echo "== $apk"
            badging="$("$bt/aapt2" dump badging "$apk")"
            package_line="$(printf '%s\n' "$badging" | grep -E '^package:' | head -1)"
            label_line="$(printf '%s\n' "$badging" | grep -E "^application-label:" | head -1)"
            echo "$package_line"
            echo "$label_line"
            printf '%s\n' "$package_line" | grep -q "package: name='$EXPECTED_PACKAGE'"
            printf '%s\n' "$label_line" | grep -q "application-label:'$EXPECTED_LABEL'"
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: appix-apk
          path: app/build/outputs/apk/dev/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Draft a GitHub release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="appix-${{ github.run_number }}"
          gh release create "$tag" app/build/outputs/apk/dev/release/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --prerelease \
            --title "Appix ${{ github.run_number }}" \
            --notes "Appix built from $GITHUB_SHA."
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,assets
